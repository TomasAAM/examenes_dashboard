# Canonical analyte dimension. Seeds the `analytes` table.
#
# direction records which way is clinically worrying, so the dashboard can
# colour a trend without hardcoding per-analyte logic: high | low | both | none
#
# unit is the canonical unit. Only cosmetic normalisation is applied
# (gr/dL -> g/dL); no numeric conversion is ever performed.

analytes:
  # ---- Iron -------------------------------------------------------------
  ferritin:               {es: Ferritina, en: Ferritin, category: iron, unit: ng/mL, direction: both}
  serum_iron:             {es: Ferremia, en: Serum iron, category: iron, unit: µg/dL, direction: both}
  transferrin:            {es: Transferrina, en: Transferrin, category: iron, unit: mg/dL, direction: both}
  tibc:                   {es: Capacidad de fijación de hierro, en: TIBC, category: iron, unit: µg/dL, direction: both}
  transferrin_saturation: {es: Saturación de transferrina, en: Transferrin saturation, category: iron, unit: "%", direction: both}

  # ---- Vitamins and minerals -------------------------------------------
  vitamin_b12:            {es: Vitamina B12, en: Vitamin B12, category: vitamins_minerals, unit: pg/mL, direction: low}
  folate:                 {es: Folato sérico, en: Serum folate, category: vitamins_minerals, unit: ng/mL, direction: low}
  vitamin_d_25oh:         {es: Vitamina D 25-OH, en: Vitamin D 25-OH, category: vitamins_minerals, unit: ng/mL, direction: low}
  magnesium:              {es: Magnesio, en: Magnesium, category: vitamins_minerals, unit: mg/dL, direction: both}

  # ---- Haematology ------------------------------------------------------
  rbc:                    {es: Recuento de eritrocitos, en: Red blood cells, category: hematology, unit: M/uL, direction: both}
  hemoglobin:             {es: Hemoglobina, en: Haemoglobin, category: hematology, unit: g/dL, direction: low}
  hematocrit:             {es: Hematocrito, en: Haematocrit, category: hematology, unit: "%", direction: low}
  mcv:                    {es: V.C.M, en: MCV, category: hematology, unit: fL, direction: both}
  mch:                    {es: H.C.M, en: MCH, category: hematology, unit: pg, direction: both}
  mchc:                   {es: C.H.C.M, en: MCHC, category: hematology, unit: g/dL, direction: both}
  rdw:                    {es: R.D.W, en: RDW, category: hematology, unit: "%", direction: high}
  platelets:              {es: Recuento de plaquetas, en: Platelets, category: hematology, unit: k/uL, direction: both}
  wbc:                    {es: Recuento de leucocitos, en: White blood cells, category: hematology, unit: k/uL, direction: both}
  esr:                    {es: V.H.S, en: ESR, category: hematology, unit: mm/hr, direction: high}
  neutrophils_pct:        {es: Segmentados, en: Neutrophils, category: hematology, unit: "%", direction: both}
  neutrophils_abs:        {es: Segmentados absolutos, en: Absolute segmented neutrophils, category: hematology, unit: /uL, direction: both}
  neutrophils_total_abs:  {es: Recuento absoluto de neutrófilos (R.A.N.), en: Absolute neutrophil count (ANC), category: hematology, unit: /uL, direction: both}
  lymphocytes_pct:        {es: Linfocitos, en: Lymphocytes, category: hematology, unit: "%", direction: both}
  lymphocytes_abs:        {es: Linfocitos absolutos, en: Absolute lymphocytes, category: hematology, unit: /uL, direction: both}
  monocytes_pct:          {es: Monocitos, en: Monocytes, category: hematology, unit: "%", direction: both}
  monocytes_abs:          {es: Monocitos absolutos, en: Absolute monocytes, category: hematology, unit: /uL, direction: both}
  eosinophils_pct:        {es: Eosinófilos, en: Eosinophils, category: hematology, unit: "%", direction: high}
  eosinophils_abs:        {es: Eosinófilos absolutos, en: Absolute eosinophils, category: hematology, unit: /uL, direction: high}
  basophils_pct:          {es: Basófilos, en: Basophils, category: hematology, unit: "%", direction: high}
  basophils_abs:          {es: Basófilos absolutos, en: Absolute basophils, category: hematology, unit: /uL, direction: high}
  band_neutrophils_pct:   {es: Baciliformes, en: Band neutrophils, category: hematology, unit: "%", direction: high}
  metamyelocytes_pct:     {es: Juveniles, en: Metamyelocytes, category: hematology, unit: "%", direction: high}
  myelocytes_pct:         {es: Mielocitos, en: Myelocytes, category: hematology, unit: "%", direction: high}
  promyelocytes_pct:      {es: Promielocitos, en: Promyelocytes, category: hematology, unit: "%", direction: high}
  blasts_pct:             {es: Blastos, en: Blasts, category: hematology, unit: "%", direction: high}
