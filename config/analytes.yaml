  ast:                    {es: Transaminasa oxaloacética (GOT), en: AST, category: liver, unit: U/L, direction: high}
  alt:                    {es: Transaminasa pirúvica (GPT), en: ALT, category: liver, unit: U/L, direction: high}
  ggt:                    {es: Gama glutamil transpeptidasa, en: GGT, category: liver, unit: U/L, direction: high}
