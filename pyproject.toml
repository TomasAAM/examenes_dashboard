[project]
name = "examenes"
version = "0.1.0"
description = "Local ingestion pipeline for BioNet lab-result PDFs into a long-format DuckDB table"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "duckdb>=1.1",
    "polars>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
examenes = "examenes.cli:app"
examenes-web = "examenes.web.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examenes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI metadata via calls in argument defaults; that is the
# framework's documented idiom, not an accident.
"src/examenes/cli.py" = ["B008"]
"src/examenes/web/api.py" = ["B008"]
# Review filenames are stamped in local time on purpose -- they are read by a
# human sorting files in a directory, not compared across timezones.
"src/examenes/review.py" = ["DTZ005"]
